spring.application.name=backend
# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:9040}
# ===============================
# DATABASE CONFIGURATION
# ===============================
# Railway Environment Variables:
# DATABASE_URL
# DATABASE_USERNAME
# DATABASE_PASSWORD
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/attendflow_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Irshan@456hus}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# HIBERNATE / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Optional (Hibernate can detect automatically)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# CORS
# ===============================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}
# ===============================
# MAIL CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:shaikirshan78@gmail.com}
spring.mail.password=${MAIL_PASSWORD:hfhuyzmjofnadazi}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.debug=false
# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.com.attendflow=INFO